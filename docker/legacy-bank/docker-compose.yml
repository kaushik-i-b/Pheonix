# Optional: portable demo environment. The reference environment for this
# workload runs the app natively against a local PostgreSQL 16 and does NOT
# use Docker; this compose file exists for portability only.
#
#   docker compose -f docker/legacy-bank/docker-compose.yml up --build
#
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: legacy_bank
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacy -d legacy_bank"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ../..
      dockerfile: docker/legacy-bank/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/legacy_bank
      SPRING_DATASOURCE_USERNAME: legacy
      SPRING_DATASOURCE_PASSWORD: legacy
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
